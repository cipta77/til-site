backend:
  name: git-gateway
  branch: main

publish_mode: simple_workflow
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "til"
    label: "TIL Notes"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Summary", name: "summary", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    files:
      - name: "projects"
        label: "Projects List"
        file: "data/projects.yaml"
        fields:
          - name: "projects"
            label: "Projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list", default: [] }

  - name: "achievements"
    label: "Achievements"
    files:
      - name: "achievements"
        label: "Achievements List"
        file: "data/achievements.yaml"
        fields:
          - name: "achievements"
            label: "Achievements"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Highlight", name: "highlight", widget: "string", required: false }

  - name: "certificates"
    label: "Certificates"
    files:
      - name: "certificates"
        label: "Certificates List"
        file: "data/certificates.yaml"
        fields:
          - name: "certificates"
            label: "Certificates"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Issuer", name: "issuer", widget: "string" }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Note", name: "note", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
