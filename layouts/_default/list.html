{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li class="post-item">
    <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if .Params.tags }}
    <span class="post-tags">
      {{ range .Params.tags }}<a class="tag" href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}
    </span>
    {{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
