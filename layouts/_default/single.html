{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">{{ .Date.Format "2006-01-02" }}
    {{ if .Params.tags }}·
    {{ range .Params.tags }}<a class="tag" href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}
    {{ end }}
  </p>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
